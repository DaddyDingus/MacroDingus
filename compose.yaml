services:
  macrotrack:
    build: .
    container_name: macrotrack
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # Calendar-day boundaries (check-ins, history windows) follow the
      # household rather than UTC. Override this IANA timezone for a fork.
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Australia/Brisbane}
      # Optional installation-wide fallback. Each account can instead save
      # its own key under More > AI features; account keys take precedence.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Optional integration with a separate weight-sync relay. Both values
      # must be set; otherwise weight mutations remain entirely local.
      - WEIGHT_SYNC_RELAY_URL=${WEIGHT_SYNC_RELAY_URL}
      - WEIGHT_SYNC_USER_NAME=${WEIGHT_SYNC_USER_NAME}
      # Accounts are self-service (login screen has a "Create an account" link) —
      # nothing to configure here. Passwords are bcrypt-hashed in the database,
      # so a forgotten one can't be looked up; reset it from the host with:
      #   docker exec -it macrotrack node dist/scripts/reset-password.js "Name" "new-password"
    networks:
      - proxy

  # Optional Tailscale sidecar: gives the PWA its own HTTPS hostname and
  # reverse-proxies to the app over the shared Docker network. Configure a
  # fresh auth key in .env; Tailscale fills in its own certificate domain.
  macrotrack-tailscale:
    image: tailscale/tailscale:stable
    container_name: macrotrack-tailscale
    restart: unless-stopped
    # TS_HOSTNAME is the Tailscale node name; do not set Docker's `hostname`
    # to the same value as the app service or Docker DNS becomes ambiguous.
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-macrotrack}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      # Tailscale requires the containing directory (not one file) to be
      # mounted so containerboot can reconcile Serve config on startup.
      - ./tailscale-config:/config:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - proxy

networks:
  proxy:
    external: true
