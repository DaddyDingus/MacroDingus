services:
  macrotrack:
    build: .
    container_name: macrotrack
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ../gymdaddy/server-backups/.weight-sync-secret:/run/secrets/gymdaddy-weight-sync-key:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # Calendar-day boundaries (check-ins, history windows) follow the
      # household rather than UTC. Override this IANA timezone for a fork.
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Australia/Brisbane}
      # Optional installation-wide fallback. Each account can instead save
      # its own key under More > AI features; account keys take precedence.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Optional integration with a separate weight-sync relay. All three
      # values must be set; otherwise weight mutations remain entirely local.
      - WEIGHT_SYNC_RELAY_URL=${WEIGHT_SYNC_RELAY_URL}
      - WEIGHT_SYNC_USER_NAME=${WEIGHT_SYNC_USER_NAME}
      - WEIGHT_SYNC_RELAY_KEY_FILE=/run/secrets/gymdaddy-weight-sync-key
      - OIDC_ISSUER=https://auth.tail984e80.ts.net/application/o/macrodaddy/
      - OIDC_CLIENT_ID=macrodaddy
      - OIDC_REDIRECT_ORIGINS=https://macrodaddy.tail984e80.ts.net
      - OIDC_BOOTSTRAP_USERNAME=daddydingus
      - OIDC_BOOTSTRAP_ACCOUNT=Tristan
    extra_hosts:
      - auth.tail984e80.ts.net:100.123.225.109
      # Family identities are created and disabled in Authentik. First OIDC
      # login provisions a new isolated MacroDaddy account automatically.
    networks:
      - proxy

  # Dedicated Tailscale identity for MacroDaddy's canonical HTTPS endpoint.
  macrodaddy-tailscale:
    image: tailscale/tailscale:stable
    container_name: macrodaddy-tailscale
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TS_HOSTNAME=macrodaddy
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./macrodaddy-tailscale-state:/var/lib/tailscale
      - ./macrodaddy-tailscale-config:/config:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - proxy

networks:
  proxy:
    external: true
