services:
  macrotrack:
    build: .
    container_name: macrotrack
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # One entry per person, "Name:password", comma-separated. Whoever's password
      # is entered on the login screen is signed in as that person — each phone
      # just needs its own password, no separate "pick a user" step. Each person's
      # food/weight log is private to them; the food database itself is shared.
      # Edit the "Partner" name/password below whenever it's actually needed, then
      # `docker compose up -d --build` (or redeploy via Dockge) to pick it up —
      # existing users are never overwritten by this on restart, only new ones added.
      - AUTH_USERS=Tristan:9wiU9KWIGDo9fbpn,Partner:changeme-partner-password
    networks:
      - proxy

networks:
  proxy:
    external: true
